name: release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Default version to use when preparing a release."
        required: true
        default: "X.Y.Z"
      nextDevelopVersion:
        description: "Default version to use next after the release."
        required: true
        default: "X.Y.Z-SNAPSHOT"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup git user
        uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35

      - name: Set up JDK 25 and OSSRH auth / GPG signing
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
          cache: "maven"
          server-id: "central"
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.gpg_private_key }}
          gpg-passphrase: SIGN_KEY_PASS

      - name: Run all Tests
        run: mvn install

      - name: Perform maven release
        run: >
            mvn -B -ntp release:prepare release:perform \
              -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ github.event.inputs.nextDevelopVersion }} \
              -Dtag=${{ github.event.inputs.releaseVersion }} \
              -Darguments="-DskipTests"
        env:
          SIGN_KEY_PASS: ${{ secrets.gpg_passphrase }}
          CENTRAL_USERNAME: ${{ secrets.sonatype_username }}
          CENTRAL_PASSWORD: ${{ secrets.sonatype_password }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event.inputs.releaseVersion }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update files
        uses: MathieuSoysal/file-updater-for-release@7f2ca99e72e4dfbda919d3c30742006f236d4992
        with:
          files: README.md # List of files to update
          prefix: "<version>" # Prefix before the version, default is: ""
          with-checkout: false # If you don't want to checkout the repo, default is: true

      - name: Push changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321
        with:
          committer_name: GitHub Actions
          committer_email: actions@github.com
          add: .
          message: ':bookmark: (readme) new maven release'

